# Project Configuration
app_name: timezone_bot
version: 0.1.0

# Interface & Reply Appearance
bot:
  # Reply rendering style:
  # - vertical: one timezone per line with flags
  # - compact_inline: "event | 10:00 Moscow, 09:00 Vienna"
  render_mode: compact_inline
  # Render compact_inline replies inside a code block for monospace alignment
  compact_inline_monospace: false
  # Prefix replies with the author's display name, e.g. "Anton:"
  show_sender_prefix: false
  # Maximum users to show in timezone conversion reply (0 = show all)
  display_limit_per_chat: 0
  # Time format: "24h" or "12h"
  time_format: "24h"
  # Show usernames next to rendered timezone groups
  show_usernames: false
  # Auto-cleanup timeout for settings commands (tb_help, tb_me, etc.) in seconds. 0 = disabled.
  settings_cleanup_timeout_seconds: 30
  # Cooldown between bot replies in same chat (0 = disabled)
  cooldown_seconds: 0

# Important Runtime Behavior
storage:
  # Delete users who haven't interacted with the bot for this many days (0 = disabled)
  inactive_user_retention_days: 30

# Event Detection (LLM Layer)
# See: journal/14_llm_module.md
event_detection:
  # Master switch for the LLM-based scheduling detector
  enabled: true

  # LLM Temperature (0.0 = deterministic, 1.0 = creative)
  temperature: 0.1

  # Number of recent human messages included in the LLM prompt window.
  # Related AI/Tool messages for those turns are included automatically.
  context_messages: 5

  # Protection against token limit exhaustion.
  # The LLM prompt (system + history + current) is trimmed to stay below this limit.
  max_tokens: 2000
  # Individual messages longer than this are truncated before prompt assembly.
  max_message_length_chars: 500

  # Concurrency & Aging
  # Messages older than this are skipped if waiting in queue
  max_message_age_seconds: 30
  # Hard skip: messages longer than this are ignored entirely (no LLM, no history)
  max_message_hard_skip_chars: 2000
  # How long to wait before re-prompting a user who ignored/abandoned DM onboarding
  dm_onboarding_cooldown_seconds: 600

  # Whether to edit existing bot messages in place when updating events.
  # If false, the bot will always delete the old message and republish a new one.
  # If true, it uses the distance-based logic below.
  edit_in_place: false


  # Visibility
  # If an edited event is older than this many messages, the bot will delete the 
  # old message and republish it at the bottom to ensure the user notices it.
  # If the distance is smaller, it's silently edited in-place.
  republish_edited_message_after_distance: 2

# Technical / Debugging
logging:
  # Levels: DEBUG, INFO, WARNING, ERROR
  level: INFO
  # Format: json or text (default: text)
  format: text

event_detection_debug:
  # Dedicated logging mode for LLM contexts (true = show full prompt in console)
  log_prompts: false
