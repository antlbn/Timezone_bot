# Logging Configuration
logging:
  # Levels: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: DEBUG

# Bot Settings
bot:
  # Show usernames next to timezone (default: false)
  show_usernames: true
  # Show event title above each block if explicitly returned by the LLM
  show_event_title: true
  # Reply layout: block or inline_sentence
  response_style: inline_sentence
  # Messages older than this are skipped before processing
  max_age_fresh_secs: 30
  # How long to wait before showing onboarding again
  onboarding_cooldown_secs: 600
  # How long to keep the latest onboarding-pending message for replay
  onboarding_pending_ttl_secs: 120
  # Auto-delete conversion results and setup prompts in group chats (seconds)
  group_auto_delete_delay_secs: 20

# Event Detection (LLM Layer)
# See: journal/14_llm_module.md
event_detection:
  # Dedicated logging mode for LLM contexts (true = show full prompt in console)
  log_prompts: false

  # Hard skip: messages longer than this are ignored before LLM detection
  max_message_hard_skip_chars: 2000
