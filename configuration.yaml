# Project Configuration
app_name: timezone_bot
version: 0.1.0

# Logging Configuration
logging:
  # Levels: DEBUG, INFO, WARNING, ERROR
  level: DEBUG
  # Format: json or text (default: text)
  format: text

# Bot Settings
bot:
  # Show usernames next to timezone (default: false)
  show_usernames: false
  # Show event title above each block if explicitly returned by the LLM
  show_event_title: false
  # Send response as a reply to the original user message
  reply_to_original_message: false
  # Auto-cleanup timeout for settings commands (tb_help, tb_me, etc.) in seconds. 0 = disabled.
  settings_cleanup_timeout_seconds: 30

# LLM Runtime
llm:
  model: gemini-2.0-flash-lite
  temperature: 0.1
  base_url: https://generativelanguage.googleapis.com/v1beta/openai
  api_key_env: GEMINI_API_KEY
  fallback:
    enabled: true
    model: llama-3.1-8b-instant
    temperature: 0.1
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY

# Event Detection (LLM Layer)
# See: journal/14_llm_module.md
event_detection:
  # Dedicated logging mode for LLM contexts (true = show full prompt in console)
  log_prompts: false

  # Aging & limits
  # Messages older than this are skipped before processing
  max_message_age_seconds: 30
  # Hard skip: messages longer than this are ignored entirely
  max_message_hard_skip_chars: 2000
  # How long to keep "frozen" messages during onboarding
  onboarding_timeout_seconds: 120
  # How long to wait before re-prompting a user who ignored/abandoned DM onboarding
  dm_onboarding_cooldown_seconds: 600

# Data Management
storage:
  # Delete users who haven't interacted with the bot for this many days (0 = disabled)
  inactive_user_retention_days: 30
