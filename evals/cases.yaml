# ============================================================
# [BASIC_POSITIVE] Clear events with explicit time
# Expected: event=true, time correctly resolved
# ============================================================

- description: "[BASIC_POSITIVE] Deadline with time inference"
  vars:
    text: "confirmed, gotta ship the press release by 8 tonight ngl"
    timestamp: "2026-03-13T15:30:00Z"
  assert:
    - type: javascript
      value: |
        const data = JSON.parse(output.replace(/```json\n?|```/g, '').trim());
        return data.time_mentioned === true && data.points.some(p => p.time === '20:00');

