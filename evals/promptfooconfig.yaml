env_file: ../.env
prompts:
  - file://prompts/prompt_v5_en.txt
  # - file://prompts/prompt_balanced.txt

providers:
  # Primary: Gemini
  - id: google:gemini-2.5-flash-lite
    label: "Gemini 2.5 Flash Lite"
    config:
      temperature: 0.1

  # Baseline: Llama 3 via Groq
  - id: groq:llama-3.1-8b-instant
    label: "Llama 3.1 8B"
    config:
      temperature: 0.1

evaluateOptions:
  maxConcurrency: 2

tests:
  # - file://cases.yaml
  - file://cases_mini.yaml

defaultTest:
  options:
    transform: output.replace(/```json\n?|```/g, '').trim()
