# Small canonical subset for fast promptfoo eval
# Purpose: catch obvious regressions fast without running the full suite.

- description: "[BASIC_POSITIVE] Clear meeting proposal"
  vars:
    sender_id: "101"
    sender_name: "Anton"
    author: "Anton"
    text: "Давай завтра в 10 утра созвонимся"
    timestamp: "2026-03-13T09:00:00Z"
  assert:
    - type: javascript
      value: |
        const data = JSON.parse(output.replace(/```json\n?|```/g, '').trim());
        return data.time_mentioned === true && data.points.some(p => p.time === '10:00');

- description: "[BASIC_POSITIVE] Explicit city conversion hint"
  vars:
    sender_id: "102"
    sender_name: "Carlos"
    author: "Carlos"
    text: "sync tomorrow at 9am EST, that's 2pm London"
    timestamp: "2026-03-13T18:00:00Z"
  assert:
    - type: javascript
      value: |
        const data = JSON.parse(output.replace(/```json\n?|```/g, '').trim());
        return data.time_mentioned === true && data.points.some(p => p.time === '14:00' && p.city === 'London');

- description: "[REGRESSION] Weekday mention must not become a fake HH:MM"
  vars:
    sender_id: "201"
    sender_name: "Vlad"
    author: "Vlad"
    text: "давайте поставим печку на воскресенье, кто за?"
    timestamp: "2026-03-16T15:00:00Z"
  assert:
    - type: javascript
      value: |
        const data = JSON.parse(output.replace(/```json\n?|```/g, '').trim());
        const hasWeekdayAsTime = data.points && data.points.some(p =>
          p.time && /воскресенье|понедельник|вторник|среда|четверг|пятница|суббота/i.test(p.time)
        );
        const allTimesAreNumeric = !data.points || data.points.every(p =>
          !p.time || /^\d{1,2}:\d{2}$/.test(p.time)
        );
        return !hasWeekdayAsTime && allTimesAreNumeric;

- description: "[TIME_PARSING] Relative time — 'через час'"
  vars:
    sender_id: "303"
    sender_name: "Jane"
    author: "Jane"
    text: "через час будет созвон"
    timestamp: "2026-03-13T12:21:00Z"
  assert:
    - type: javascript
      value: |
        const data = JSON.parse(output.replace(/```json\n?|```/g, '').trim());
        return data.time_mentioned === true && data.points.some(p => p.time === '13:21');

- description: "[TIME_PARSING] Multi-point availability window"
  vars:
    sender_id: "304"
    sender_name: "Elena"
    author: "Elena"
    text: "I am free between 14:00 and 17:30 tomorrow"
    timestamp: "2026-03-13T10:00:00Z"
  assert:
    - type: javascript
      value: |
        const data = JSON.parse(output.replace(/```json\n?|```/g, '').trim());
        return data.time_mentioned === true
          && data.points.length === 2
          && data.points.some(p => p.time === '14:00')
          && data.points.some(p => p.time === '17:30');
