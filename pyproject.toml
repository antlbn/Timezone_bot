[project]
name = "timezone-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.24.0",
    "aiohttp>=3.13.3",
    "aiosqlite>=0.22.1",
    "discord-py>=2.6.4",
    "geopy>=2.4.1",
    "openai>=2.24.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "timezonefinder>=8.2.1",
    "tzdata>=2025.3",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.9.0",
    "types-PyYAML>=6.0.12.20250915",
]

[tool.pyright]
extraPaths = [".", "src"]

[tool.mypy]
python_version = "3.12"
files = [
    "src/core",
    "src/ports",
    "src/adapters/outbound/openai_detector.py",
    "src/adapters/outbound/sqlite_storage.py",
    "src/config.py",
    "src/config_schema.py",
]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src", "."]
